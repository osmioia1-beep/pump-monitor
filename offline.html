<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2c3e50">
    <title>Pump Monitor · Connection needed</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f5f5; color: #2c3e50; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        main { max-width: 380px; }
        img { width: 72px; height: 72px; border-radius: 16px; }
        h1 { font-size: 1.6rem; }
        p { line-height: 1.6; }
        a { display: inline-block; margin-top: 12px; padding: 14px 24px; background: #2668a3; color: white; border-radius: 6px; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <img src="/icon-192.png" alt="">
        <h1>Connection needed</h1>
        <p>Pump Monitor could not connect. Reconnect to the internet and try again to load live readings and charts.</p>
        <a href="/">Try again</a>
    </main>
</body>
</html>
